# ═══════════════════════════════════════════════════════════════
#  models.yaml — Editorial metadata for the site generator
#
#  - Benchmark DATA is read automatically from results/*/summary.json
#  - This file controls WHAT appears on the site and HOW it's presented
#  - "results_dir" must match the folder name under results/
# ═══════════════════════════════════════════════════════════════

# Which benchmarks to show, and in what order
benchmarks:
  arc_chat:
    label: "ARC-Challenge (Chat)"
    color: "#4fc3f7"
    color_bg: "rgba(79,195,247,0.15)"
  ifeval_prompt_strict:
    label: "IFEval (strict)"
    color: "#ab47bc"
    color_bg: "rgba(171,71,188,0.15)"
  gsm8k:
    label: "GSM8K"
    color: "#ffa726"
    color_bg: "rgba(255,167,38,0.15)"
  humaneval_pass_at_1:
    label: "HumanEval"
    color: "#66bb6a"
    color_bg: "rgba(102,187,106,0.15)"
  humaneval_plus_pass_at_1:
    label: "HumanEval+"
    color: "#26a69a"
    color_bg: "rgba(38,166,154,0.15)"
  bbeh_mini:
    label: "BBEH Mini"
    color: "#ef5350"
    color_bg: "rgba(239,83,80,0.15)"
  arc_challenge:
    label: "ARC-Challenge"
    color: "#29b6f6"
    color_bg: "rgba(41,182,246,0.15)"
  bigcodebench:
    label: "BigCodeBench"
    color: "#ffca28"
    color_bg: "rgba(255,202,40,0.15)"
  tau2_telecom:
    label: "TAU2 Telecom"
    color: "#ff7043"
    color_bg: "rgba(255,112,67,0.15)"

# Quantization ordering (low → high quality)
# The build script will sort quants in this order
quant_order:
  - IQ1_M
  - IQ2_XXS
  - IQ2_M
  - Q2_K_XL
  - IQ3_XXS
  - IQ3_S
  - Q3_K_S
  - Q3_K_M
  - Q3_K_XL
  - IQ4_XS
  - IQ4_NL
  - Q4_0
  - Q4_1
  - Q4_K_S
  - Q4_K_M
  - Q4_K_XL
  - MXFP4
  - IQ4_NL_XL
  - Q5_K_S
  - Q5_K_M
  - Q5_K_XL
  - Q6_K
  - Q6_K_XL
  - Q8_0
  - Q8_K_XL
  - BF16

# ─── Models ───────────────────────────────────────────────────
models:
  qwen36_27b_mtp:
    name: "Qwen 3.6 27B MTP Dense"
    results_dir: "Qwen3.6-27B-MTP"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.6-27B-MTP-GGUF"
    compare_color: "#42a5f5"
    compare_style: "dashed"
    takeaway: >
      Results via inspect_ai (BigCodeBench only so far).
      IQ4_NL and Q3_K_M both reach <strong>60%</strong> on BigCodeBench,
      while Q4_0 pushes to <strong>63%</strong>. IQ4_XS and Q3_K_S score
      slightly lower (57% and 53%). More benchmarks pending.

  qwen35_9b:
    name: "Qwen 3.5 9B Dense"
    results_dir: "Qwen3.5-9B"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.5-9B-GGUF"
    compare_color: "#ffcc80"
    compare_style: "dashed"
    takeaway: >
      Results via inspect_ai (BigCodeBench, 100 samples).
      UD-Q8_K_XL and UD-Q6_K_XL both reach <strong>52%</strong>, while UD-IQ2_M
      drops to <strong>29%</strong>. The sweet spot is
      <strong>Q4_K_M or Q5_K_M</strong> (~49%). BF16 scores 47% —
      consistent with the quantization noise at this sample size.

  qwen35_4b:
    name: "Qwen 3.5 4B Dense"
    results_dir: "Qwen3.5-4B"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.5-4B-GGUF"
    compare_color: "#ef5350"
    compare_style: "solid"
    takeaway: >
      Results via inspect_ai (BigCodeBench, 100 samples).
      IQ2_XXS completely collapses to <strong>0%</strong> — non-functional.
      IQ2_M recovers to only 17%. The floor is around <strong>Q3_K_M (36%)</strong>.
      The sweet spot is <strong>Q4_K_M at 43%</strong>; above Q4, scores plateau
      in the 37–41% range with no consistent gain.

  qwen36_35b_mtp:
    name: "Qwen 3.6 A35B A3B MTP (MoE)"
    results_dir: "Qwen3.6-36B-A3B-MTP"
    provider: "Unsloth"
    arch: "MoE"
    hf_repo: "unsloth/Qwen3.6-35B-A3B-GGUF"
    compare_color: "#80cbc4"
    compare_style: "dotted"
    takeaway: >
      Results via inspect_ai (BBEH Mini, 100 samples).
      The MoE architecture again shows strong resilience:
      <strong>IQ4_NL reaches 54%</strong> while IQ1_M/IQ2_XXS/Q3_K_M
      cluster around 40–41%. There is a clear step at Q4 — consistent
      with the pattern observed on other benchmarks.

  gemma4:
    name: "Gemma 4 26B A4B (MoE)"
    results_dir: "gemma-4-26B-A4B-it"
    provider: "Unsloth"
    arch: "MoE"
    hf_repo: "unsloth/gemma-4-26B-A4B-it-GGUF"
    compare_color: "#ce93d8"
    compare_style: "dashed"
    takeaway: >
      <strong>HumanEval and HumanEval+ were not run</strong>: these
      benchmarks use a code-completion format (complete the function stub)
      that is fundamentally incompatible with instruct-tuned models, which
      respond in chat mode rather than completing raw code — this reflects
      a benchmark format mismatch, not the model's coding ability.
      IFEval and GSM8K are exceptionally stable across the entire
      quantization range (±2 points from IQ2 to Q5), consistent with
      the MoE architecture's resilience. ARC shows the only real cliff
      at IQ2 (<strong>~8–9 points below</strong> the Q4 range).
      <strong>IQ3_XXS is the practical floor</strong>: it already matches
      MXFP4 on IFEval and GSM8K, and recovers nearly all the ARC score —
      going above Q4 offers diminishing returns.

# Comparison chart takeaways (section 3)
compare_takeaways:
  arc_chat: >
    <strong>ARC-Challenge</strong> is the most resilient benchmark. MoE
    models barely move across the entire quantization range. Dense models
    show a clear cliff below Q3, especially smaller ones.
  ifeval_prompt_strict: >
    <strong>IFEval</strong> (instruction following) holds well across
    architectures. Good news for agentic use cases: Q3 and above are
    reliable across the board.
  gsm8k: >
    <strong>GSM8K</strong> (reasoning) is flat for the Qwen 3.6 A35B:
    89–90% from IQ1_M to IQ4_NL (±1%), so only boundary quants were
    measured — quantization barely affects reasoning on this MoE
    architecture. Dense models show the expected Q3 floor pattern.
  humaneval_pass_at_1: >
    <strong>HumanEval</strong> (code generation) is the first benchmark
    to collapse under quantization. The floor varies by model size —
    larger models can go as low as IQ2_M, smaller ones may not reach
    65% even at Q4. <strong>Q4 is a safe starting point</strong>; check
    the per-model takeaway for the actual floor.
  humaneval_plus_pass_at_1: >
    <strong>HumanEval+</strong> (80× more tests) amplifies the same
    pattern. Scores are systematically lower than HumanEval, confirming
    that some code passes by luck at higher quants.
  bbeh_mini: >
    <strong>BBEH Mini</strong> (Big-Bench Extra Hard, 100 samples via
    inspect_ai) is only available for the Qwen 3.6 A35B A3B MTP variants
    so far. A clear step appears at Q4: IQ1_M–Q3_K_M cluster around
    40–41% while IQ4_NL reaches 54%.
  arc_challenge: >
    <strong>ARC-Challenge</strong> via inspect_ai. Results pending.
  tau2_telecom: >
    <strong>TAU2 Telecom</strong> is an agentic benchmark: the model acts as a support agent
    diagnosing telecom issues (MMS, mobile data, roaming) by following a multi-step decision tree —
    full benchmark, 114 samples. Only available for Qwen 3.5 9B so far.
    Scores are very low (1–2%), reflecting the difficulty of multi-turn agentic reasoning at this scale.
