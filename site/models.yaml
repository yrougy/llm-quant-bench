# ═══════════════════════════════════════════════════════════════
#  models.yaml — Editorial metadata for the site generator
#
#  - Benchmark DATA is read automatically from results/*/summary.json
#  - This file controls WHAT appears on the site and HOW it's presented
#  - "results_dir" must match the folder name under results/
# ═══════════════════════════════════════════════════════════════

# Which benchmarks to show, and in what order
benchmarks:
  bigcodebench:
    label: "BigCodeBench"
    color: "#4fc3f7"
    color_bg: "rgba(79,195,247,0.15)"
  musr:
    label: "MUSR"
    color: "#ab47bc"
    color_bg: "rgba(171,71,188,0.15)"
  gpqa:
    label: "GPQA"
    color: "#ffa726"
    color_bg: "rgba(255,167,38,0.15)"
  bfcl:
    label: "BFCL"
    color: "#66bb6a"
    color_bg: "rgba(102,187,106,0.15)"

# Quantization ordering (low → high quality)
# The build script will sort quants in this order
quant_order:
  - IQ1_M
  - IQ2_XXS
  - IQ2_M
  - Q2_K_XL
  - IQ3_XXS
  - IQ3_S
  - Q3_K_S
  - Q3_K_M
  - Q3_K_XL
  - IQ4_XS
  - IQ4_NL
  - Q4_0
  - Q4_1
  - Q4_K_S
  - Q4_K_M
  - Q4_K_XL
  - MXFP4
  - MXFP4_MOE
  - IQ4_NL_XL
  - Q5_K_S
  - Q5_K_M
  - Q5_K_XL
  - Q6_K
  - Q6_K_XL
  - Q8_0
  - Q8_K_XL
  - BF16

# ─── Models ───────────────────────────────────────────────────
models:
  qwen36_27b_mtp:
    name: "Qwen 3.6 27B MTP Dense"
    results_dir: "Qwen3.6-27B-MTP"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.6-27B-MTP-GGUF"
    compare_color: "#42a5f5"
    compare_style: "dashed"
    takeaway: >
      BigCodeBench results (full run, inspect_ai).
      Remarkably flat from Q3_K_S upward: everything sits between
      <strong>59% and 62%</strong>, with IQ4_XS on top (<strong>61.8%</strong>).
      Only the 2-bit quants pay a real price — UD-IQ2_M drops to 56.5% and
      UD-IQ2_XXS to <strong>49.6%</strong>. MUSR, GPQA and BFCL pending.

  qwen35_9b:
    name: "Qwen 3.5 9B Dense"
    results_dir: "Qwen3.5-9B"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.5-9B-GGUF"
    compare_color: "#ffcc80"
    compare_style: "dashed"
    takeaway: >
      BigCodeBench results (full run, inspect_ai).
      Scores plateau around <strong>48–50%</strong> from Q4 upward
      (best: UD-Q4_K_XL at <strong>49.6%</strong>, Q8_0 at 49.5%).
      Below Q3 the model collapses: UD-Q2_K_XL falls to 29.6% and UD-IQ2_XXS
      to a catastrophic <strong>7.1%</strong>. The sweet spot is
      <strong>Q4_K_S / Q4_K_M</strong>. MUSR, GPQA and BFCL pending.

  qwen36_35b_mtp:
    name: "Qwen 3.6 35B A3B MTP (MoE)"
    results_dir: "Qwen3.6-36B-A3B-MTP"
    provider: "Unsloth"
    arch: "MoE"
    hf_repo: "unsloth/Qwen3.6-35B-A3B-GGUF"
    compare_color: "#80cbc4"
    compare_style: "dotted"
    takeaway: >
      BigCodeBench results (full run, inspect_ai).
      The MoE architecture shows strong resilience across the quant range.
      MUSR, GPQA and BFCL pending.

  ornith_9b:
    name: "Ornith 1.0 9B Dense"
    results_dir: "Ornith-1.0-9B"
    provider: "DeepReinforce"
    arch: "Dense"
    hf_repo: "deepreinforce-ai/Ornith-1.0-9B-GGUF"
    compare_color: "#ce93d8"
    compare_style: "dashed"
    takeaway: >
      BigCodeBench results (full run, inspect_ai).
      Scores are remarkably stable across quants — Q4_K_M (<strong>49.2%</strong>)
      and Q8_0 (<strong>49.0%</strong>) are essentially identical, with Q6_K slightly
      lower at 48.0%. BF16 reaches <strong>50.8%</strong>, confirming the quantization
      floor is reached as early as Q4_K_M for this model.
      MUSR, GPQA and BFCL pending.

# Comparison chart takeaways (section 3)
compare_takeaways:
  bigcodebench: >
    <strong>BigCodeBench</strong> (code generation, unit-test scoring) is consistently
    the benchmark most sensitive to quantization. Dense models show a clear performance
    cliff at aggressive quants. MoE architectures are more resilient across the range.
    <strong>Q4_K_M is a reliable floor</strong> for most models; going below Q3 risks
    significant drops on coding tasks.
  musr: >
    <strong>MUSR</strong> (multi-step narrative reasoning) was chosen because it stays
    well away from saturation on modern models while remaining fast to run.
    Results pending — first runs in progress.
  gpqa: >
    <strong>GPQA</strong> (graduate-level science Q&amp;A) is the hardest benchmark in the suite —
    even frontier models are far from the ceiling, which should make it a strong discriminator
    for the combined cost of size reduction and quantization. Results pending.
  bfcl: >
    <strong>BFCL</strong> (function calling, AST-matched) measures the practical agentic
    capability most sensitive to quantization noise: generating well-formed structured tool calls.
    Results pending — first runs in progress.
