# ═══════════════════════════════════════════════════════════════
#  models.yaml — Editorial metadata for the site generator
#
#  - Benchmark DATA is read automatically from results/*/summary.json
#  - This file controls WHAT appears on the site and HOW it's presented
#  - "results_dir" must match the folder name under results/
# ═══════════════════════════════════════════════════════════════

# Which benchmarks to show, and in what order
benchmarks:
  bigcodebench:
    label: "BigCodeBench"
    color: "#4fc3f7"
    color_bg: "rgba(79,195,247,0.15)"
  musr:
    label: "MUSR"
    color: "#ab47bc"
    color_bg: "rgba(171,71,188,0.15)"
  # gpqa désactivé pour le moment — trop long à exécuter sur le hardware actuel
  # gpqa:
  #   label: "GPQA"
  #   color: "#ffa726"
  #   color_bg: "rgba(255,167,38,0.15)"
  bfcl:
    label: "BFCL"
    color: "#66bb6a"
    color_bg: "rgba(102,187,106,0.15)"

# Quantization ordering (low → high quality)
# The build script will sort quants in this order
quant_order:
  - IQ1_M
  - IQ2_XXS
  - IQ2_S
  - IQ2_M
  - Q2_K_XL
  - IQ3_XXS
  - IQ3_S
  - Q3_K_S
  - Q3_K_M
  - Q3_K_XL
  - IQ4_XS
  - IQ4_NL
  - Q4_0
  - Q4_1
  - Q4_K_S
  - Q4_K_M
  - Q4_K_XL
  - MXFP4
  - MXFP4_MOE
  - IQ4_NL_XL
  - Q5_K_S
  - Q5_K_M
  - Q5_K_XL
  - Q6_K
  - Q6_K_XL
  - Q8_0
  - Q8_K_XL
  - BF16

# ─── Models ───────────────────────────────────────────────────
models:
  qwen36_27b_mtp:
    name: "Qwen 3.6 27B MTP Dense"
    results_dir: "Qwen3.6-27B-MTP"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.6-27B-MTP-GGUF"
    compare_color: "#42a5f5"
    compare_style: "dashed"
    takeaway: >
      MUSR and BFCL cover the full quant range (inspect_ai). BigCodeBench is
      missing for IQ4_NL, Q5_K_M, Q5_K_S and UD-Q5_K_XL — these higher-precision
      quants didn't fit in VRAM alongside BigCodeBench's sandboxed execution on
      this hardware (see the FAQ).
      Where it was run, BigCodeBench is remarkably flat from Q3_K_S upward: everything sits between
      <strong>59% and 62%</strong>, with IQ4_XS on top (<strong>61.8%</strong>).
      Only the 2-bit quants pay a real price on code — UD-IQ2_M drops to 56.5% and
      UD-IQ2_XXS to <strong>49.6%</strong>. MUSR (63.6–70.4%) and BFCL (68.2–74.3%)
      stay essentially flat across the <em>whole</em> range, including the
      2-bit quants — differences there are within noise on 250 samples.

  qwen35_9b:
    name: "Qwen 3.5 9B Dense"
    results_dir: "Qwen3.5-9B"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.5-9B-GGUF"
    compare_color: "#ffcc80"
    compare_style: "dashed"
    takeaway: >
      Full run across all three benchmarks (inspect_ai).
      BigCodeBench plateaus around <strong>48–50%</strong> from Q4 upward
      (best: UD-Q4_K_XL at <strong>49.6%</strong>, Q8_0 at 49.5%) then collapses
      below Q3: UD-Q2_K_XL falls to 29.6% and UD-IQ2_XXS to a catastrophic
      <strong>7.1%</strong>. MUSR and BFCL degrade far more gently at the same
      quant levels — both only fall to <strong>~50–55%</strong> at UD-IQ2_XXS,
      nowhere near BigCodeBench's collapse. This is the clearest case in the
      dataset for <strong>code generation being much more fragile to aggressive
      quantization</strong> than MCQ reasoning or tool calling. The sweet spot
      for coding remains <strong>Q4_K_S / Q4_K_M</strong>.

  qwen36_35b_mtp:
    name: "Qwen 3.6 35B A3B MTP (MoE)"
    results_dir: "Qwen3.6-36B-A3B-MTP"
    provider: "Unsloth"
    arch: "MoE"
    hf_repo: "unsloth/Qwen3.6-35B-A3B-GGUF"
    compare_color: "#80cbc4"
    compare_style: "dotted"
    takeaway: >
      Across most of this quant range (inspect_ai), results confirm the MoE
      architecture's resilience. BigCodeBench barely moves — <strong>57.3% to
      59.6%</strong> across the entire range, including the most aggressive
      UD-IQ2_XXS. MUSR stays in a <strong>67.6–74.4%</strong> band with no clear
      trend by quant level. BFCL is the only benchmark showing a real dip at the
      bottom of the range — UD-IQ1_M drops to <strong>58.9%</strong> versus
      ~65–70% everywhere else — but even that is far milder than the dense
      models' BigCodeBench cliff.

  # qwen38_27b_xhigh désactivé — run affecté par un bug de reasoning effort
  # (enable_thinking non honoré, thinking resté à xhigh par défaut, voir
  # CAVEATS.md). Données conservées dans results/ pour l'historique, mais
  # exclues du site le temps du rerun en medium.
  # qwen38_27b_xhigh:
  #   name: "Qwen 3.8 27B Dense (xhigh)"
  #   results_dir: "Qwen3.8-27B-xhigh"
  #   provider: "Unsloth"
  #   arch: "Dense"
  #   hf_repo: "unsloth/Qwen3.8-27B-GGUF"
  #   compare_color: "#ef5350"
  #   compare_style: "solid"
  #   takeaway: >
  #     Excluded from the site — this run defaulted to xhigh reasoning effort
  #     instead of the project's usual off/medium setting. See CAVEATS.md.

  qwen38_27b:
    name: "Qwen 3.8 27B Dense"
    results_dir: "Qwen3.8-27B"
    provider: "Unsloth"
    arch: "Dense"
    hf_repo: "unsloth/Qwen3.8-27B-GGUF"
    compare_color: "#ef5350"
    compare_style: "solid"
    takeaway: >
      Rerun in progress with `reasoning_effort` correctly set to medium this
      time (the earlier xhigh run is quarantined — see CAVEATS.md). Only the
      four most aggressive quants have landed so far: UD-IQ1_M, UD-IQ2_S,
      UD-IQ2_XXS and UD-Q2_K_XL. BFCL is already in a reasonable
      <strong>59.3–71.6%</strong> band. BigCodeBench and MUSR are notably
      non-monotonic in this early batch — UD-IQ2_S actually scores lower than
      the more aggressive UD-IQ2_XXS on both (BigCodeBench 39.7% vs 50.9%,
      MUSR 48.8% vs 64.4%). Too early to draw conclusions; check back as more
      quants complete.

  ornith_9b:
    name: "Ornith 1.0 9B Dense"
    results_dir: "Ornith-1.0-9B"
    provider: "DeepReinforce"
    arch: "Dense"
    hf_repo: "deepreinforce-ai/Ornith-1.0-9B-GGUF"
    compare_color: "#ce93d8"
    compare_style: "dashed"
    takeaway: >
      Only Q4_K_M through BF16 have been benchmarked for this model so far —
      no Q3-and-below quants are available yet, so this does not locate a
      quantization floor. Within that range, all three benchmarks sit flat
      within noise: BigCodeBench <strong>48.0–50.8%</strong>, MUSR
      <strong>59.2–65.6%</strong>, BFCL <strong>66.3–67.7%</strong>. Q4_K_M
      already performs indistinguishably from BF16 here, but whether lower
      quants hold up as well as they do for the other three models is still
      untested.

# Comparison chart takeaways (section 3)
compare_takeaways:
  bigcodebench: >
    <strong>BigCodeBench</strong> (code generation, unit-test scoring) is consistently
    the benchmark most sensitive to quantization. Dense models show a clear performance
    cliff at aggressive quants. MoE architectures are more resilient across the range.
    <strong>Q4_K_M is a reliable floor</strong> for most models; going below Q3 risks
    significant drops on coding tasks.
  musr: >
    <strong>MUSR</strong> (multi-step narrative reasoning) was chosen because it stays
    well away from saturation on modern models while remaining fast to run. It turns out
    to be far more forgiving of quantization than BigCodeBench — even at 2-bit (and 1-bit
    for the MoE model), scores stay within a few points of the high-precision baseline.
    Useful for confirming a model still reasons coherently, but it won't catch the kind
    of collapse that shows up in code generation.
  # gpqa désactivé pour le moment (voir benchmarks: plus haut)
  # gpqa: >
  #   <strong>GPQA</strong> (graduate-level science Q&amp;A) is the hardest benchmark in the suite —
  #   even frontier models are far from the ceiling, which should make it a strong discriminator
  #   for the combined cost of size reduction and quantization. Results pending.
  bfcl: >
    <strong>BFCL</strong> (function calling, AST-matched) measures the practical agentic
    capability of generating well-formed structured tool calls. It sits between the two
    extremes: mostly resilient, with a real but moderate drop only at the most aggressive
    quants (e.g. UD-IQ2_XXS on Qwen 3.5 9B falls to ~50%, UD-IQ1_M on the MoE model to ~59%).
    Structured tool-call generation degrades more than MCQ reasoning but far less than
    executable code. Scores are computed on a fixed 1000-sample subset of BFCL (seed 42),
    not the full benchmark.
